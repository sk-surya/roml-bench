[package]
name = "roml-bench-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "roml-bench-core"
path = "src/main.rs"

[[bin]]
name = "roml-ops-probe"
path = "src/bin/ops_probe.rs"

[dependencies]
roml = { git = "https://github.com/sk-surya/roml", rev = "d6afabd2988761fe9d5dd08597491a6f3fb73779" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
