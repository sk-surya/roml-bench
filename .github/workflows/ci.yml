name: ci

on:
  push:
  pull_request:

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Bootstrap (ROML wheel + Rust core)
        run: ./scripts/bootstrap.sh
      - name: Ruff
        run: uv run ruff check src tests
      - name: Python tests
        run: uv run pytest -q -m "not external"
      - name: Site smoke from fixture
        run: |
          uv run python - <<'EOF'
          import json, shutil
          from pathlib import Path
          from roml_bench.summarize import write_summary
          run_dir = Path("smoke-run")
          if run_dir.exists():
              shutil.rmtree(run_dir)
          run_dir.mkdir()
          (run_dir / "run.json").write_text(json.dumps({
              "run_id": "ci-smoke", "profile": "quick", "seed": 20260908,
              "benchmark_sha": "ci", "roml_sha": "ci", "stopped": [],
          }))
          (run_dir / "environment.json").write_text(json.dumps({
              "timestamp_utc": "2026-09-08T00:00:00Z", "platform": "ci",
              "python": "3.13", "packages": {},
          }))
          shutil.copy("fixtures/quick-results.jsonl", run_dir / "raw.jsonl")
          write_summary(run_dir)
          EOF
          mkdir -p results
          echo '{"status": "ok"}' > results/validation.json
          uv run roml-bench site smoke-run --output smoke-site
          test -f smoke-site/index.html
          test -f smoke-site/static/plotly.min.js
          ! grep -Eo 'src="https?://[^"]+"|href="https?://[^"]+"' smoke-site/*.html
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p roml-bench-core --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test -p roml-bench-core

  external-arms:
    needs: [correctness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Bootstrap (ROML wheel + Rust core)
        run: ./scripts/bootstrap.sh
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12.7"
      - name: Cache Julia packages
        uses: actions/cache@v4
        with:
          path: ~/.julia
          key: julia-${{ runner.os }}-${{ runner.arch }}-1.12.7-${{ hashFiles('julia/Manifest.toml') }}
      - name: Instantiate Julia project
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Discover g++ version
        id: gxx
        run: echo "version=$(g++ -dumpversion)" >> "$GITHUB_OUTPUT"
      - name: Cache OR-Tools source/build tree
        id: ortools-cache
        uses: actions/cache@v4
        with:
          path: .cache/or-tools-v9.15
          key: ortools-${{ runner.os }}-${{ runner.arch }}-g++${{ steps.gxx.outputs.version }}-v9.15-highs-only-v1
      - name: Clone pinned OR-Tools (cache miss)
        if: steps.ortools-cache.outputs.cache-hit != 'true'
        run: git clone --branch v9.15 --depth 1 https://github.com/google/or-tools.git .cache/or-tools-v9.15
      - name: Configure OR-Tools (cache miss)
        if: steps.ortools-cache.outputs.cache-hit != 'true'
        run: >
          cmake -S .cache/or-tools-v9.15 -B .cache/or-tools-v9.15/build
          -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_CXX=ON -DBUILD_PYTHON=OFF -DBUILD_JAVA=OFF -DBUILD_DOTNET=OFF
          -DBUILD_SAMPLES=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF
          -DBUILD_DEPS=ON
          -DUSE_BOP=OFF -DUSE_COINOR=OFF -DUSE_GLOP=OFF -DUSE_GLPK=OFF
          -DUSE_GUROBI=OFF -DUSE_HIGHS=ON -DUSE_PDLP=OFF -DUSE_SCIP=OFF
          -DUSE_XPRESS=OFF -DUSE_CPLEX=OFF
      - name: Build OR-Tools (cache miss)
        if: steps.ortools-cache.outputs.cache-hit != 'true'
        run: cmake --build .cache/or-tools-v9.15/build --target ortools -j "$(nproc)"
      - name: Verify OR-Tools tree
        run: |
          git -C .cache/or-tools-v9.15 describe --tags --exact-match
          test -f .cache/or-tools-v9.15/build/lib/libortools.so
      - name: Build current MathOpt runner
        run: bash cpp/build.sh
      - name: Verify strict linkage
        run: test "$(ldd -r cpp/build/mathopt_bench | grep -c undefined || true)" = "0"
      - name: MathOpt LD_BIND_NOW smoke
        run: |
          ROML_SHA=$(uv run python -c "from roml_bench.schema import ROML_SHA; print(ROML_SHA)")
          LD_BIND_NOW=1 ./cpp/build/mathopt_bench --workload sparse_rows --size 100 \
            --seed 20260908 --replicate 0 --run-id ci-smoke --benchmark-sha ci \
            --roml-sha "$ROML_SHA" --timestamp-utc ci \
            --implementation ortools_mathopt_cpp \
            | tee /tmp/mathopt_smoke.json | uv run python -c \
              "import json,sys; d = json.load(sys.stdin); assert d['status'] == 'ok', d; print('mathopt bind-now smoke ok')"
      - name: External execution tests (zero skips permitted)
        run: |
          set -o pipefail
          uv run pytest -q -m external -rs 2>&1 | tee /tmp/external_tests.log
          ! grep -Eq "[0-9]+ skipped" /tmp/external_tests.log
      - name: Full 12-arm validation
        run: uv run roml-bench validate
